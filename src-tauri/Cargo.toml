[package]
name = "tiller"
version = "0.1.0"
description = "Tiller: keyboard-first SSH client"
authors = ["you"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows.
name = "sshdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.65.2", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1", features = ["net", "sync", "time", "macros", "rt-multi-thread", "io-util"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

# Secrets go to Windows Credential Manager / macOS Keychain.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
