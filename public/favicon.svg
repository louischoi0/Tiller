<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Tiller app icon. Source for `npx tauri icon app-icon.svg`, which writes src-tauri/icons/*. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26385f" />
      <stop offset="1" stop-color="#16223d" />
    </linearGradient>
  </defs>
  <!-- navy tile (the app's navy token), soft rounded corners -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)" />
  <rect x="64.5" y="64.5" width="895" height="895" rx="199.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
  <!-- prompt chevron: its start is the round tiller handle -->
  <path d="M300 352 L520 512 L300 672" fill="none" stroke="#e8edf7" stroke-width="72" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="300" cy="352" r="58" fill="#e8edf7" />
  <!-- cursor in the pastel "connected" green -->
  <rect x="570" y="636" width="200" height="72" rx="36" fill="#9be0b4" />
</svg>
